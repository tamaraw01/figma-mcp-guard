[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "figma-mcp-guard"
version = "1.0.0"
description = "Check W3C DTCG design tokens against generated CSS variables and Tailwind v4 @theme blocks."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []

[project.scripts]
figma-mcp-guard = "figma_mcp_guard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
